services:
  telemetry:
    build: .
    container_name: ${CONTAINER_NAME:-nautilus-telemetry}
    restart: always
    environment:
      - TZ=Europe/Rome
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - BOAT_NAME=${BOAT_NAME}
      - KNOT_HOST=${KNOT_HOST:-}
      - KNOT_USER=${KNOT_USER:-}
      - KNOT_PASS=${KNOT_PASS:-}
      - BM6_MAC=${BM6_MAC:-}
      - MPPT_MAC=${MPPT_MAC:-}
      - CONTICINI_BASE=${CONTICINI_BASE:-}
      - URL_PREFIX_ALIAS=${URL_PREFIX_ALIAS:-}
      - BL917_ENABLED=${BL917_ENABLED:-0}
      - BL917_WS=${BL917_WS:-}
      - BL917_MAC=${BL917_MAC:-}
      - VICTRON_MAC=${VICTRON_MAC:-}
      - VICTRON_SERIAL=${VICTRON_SERIAL:-}
      - VICTRON_PUK=${VICTRON_PUK:-}
      - VICTRON_ADV_KEY=${VICTRON_ADV_KEY:-}
      - STATIONARY_SPEED_KN=${STATIONARY_SPEED_KN:-0.5}
      - GPS_STATIONARY_INTERVAL=${GPS_STATIONARY_INTERVAL:-600}
      - DATA_BUDGET_MB=${DATA_BUDGET_MB:-1000}
      - DATA_USAGE_POLL_SECONDS=${DATA_USAGE_POLL_SECONDS:-600}
      - SOLAR_DB=${SOLAR_DB:-data/nautilus.db}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
